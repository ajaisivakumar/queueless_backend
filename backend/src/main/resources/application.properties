# Values come from Render environment variables (leave them blank here)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Creates tables automatically on startup
spring.sql.init.mode=always

# Small pool + short lifetime so Neon's auto-suspend never leaves dead connections
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=60000

# Render provides PORT automatically
server.port=${PORT:8080}
